<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Practice</title>
</head>

<body>

    <h1>User Storage</h1>

    <input id="username" type="text" placeholder="Enter username">
    <br><br>

    <input id="email" type="email" placeholder="Enter email">
    <br><br>

    <input id="address" type="text" placeholder="Enter address">
    <br><br>

    <button id="localBtn">Save to LocalStorage</button>

    <button id="sessionBtn">Save to SessionStorage</button>

    <button id="showBtn">Show Data</button>   
    
    <button id="clearLocalBtn">Clear LocalStorage</button>

    <button id="clearSessionBtn">Clear SessionStorage</button>

    <button id="clearAllBtn">Clear All Storage</button>

    <h2 id="result"></h2>

    <script src="storage.js"></script>

</body>
</html>
