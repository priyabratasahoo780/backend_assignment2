<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="parent">
    <button id="child">Click Me</button>
    <div id="result">Result</div>
</div>

</body>
<style>
    #parent{
        height: 100px;
        width: 100px;
        background-color: red;
        color: white;
        padding: 20px;
        margin: 20px;
        cursor: pointer;
        text-align: center;
    }
    #child{
        background-color: green;
        color: white;
        padding: 20px;
        margin: 20px;
        cursor: pointer;
        text-align: center;
    }
    #result{
        background-color: blue;
        color: white;
        padding: 20px;
        margin: 20px;
        cursor: pointer;
        text-align: center;
        height: 10px;
        width: 140px;
    }
</style>
<script>
    document.getElementById("parent").addEventListener("click",  () => {
        console.log("Parent clicked");
    });

    document.getElementById("child").addEventListener("click", function () {
        console.log("Child clicked");
        document.getElementById("result").textContent = "Click Result";
    });

   
</script>
</html>
